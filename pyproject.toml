[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undertow-llm"
version = "0.2.6"
description = "LLM observability and resilience decorator — semantic prompt caching, automatic retries, rate limiting, cost tracking, and a local web dashboard for any Python LLM call."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "llm",
    "llm-observability",
    "llm-monitoring",
    "semantic-caching",
    "llm-cache",
    "rate-limiting",
    "llm-retries",
    "fallback-chain",
    "openai",
    "gemini",
    "anthropic",
    "ollama",
    "ai-infrastructure",
    "prompt-caching",
    "cost-tracking",
    "distributed-tracing",
    "pgvector",
    "redis",
    "fastapi",
    "python-sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
authors = [{ name = "Amogh Arora" }]
dependencies = [
    # Semantic cache
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",

    # Dashboard backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",

    # CLI
    "click>=8.1.7",

    # Utilities
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",       # async HTTP for alerting webhook
]

# LLM providers are optional — undertow_llm is provider-agnostic.
# Install the provider you use, e.g.: pip install undertow-llm[gemini]
[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
ollama = ["ollama>=0.2.0"]
all-providers = ["google-genai>=1.0.0", "ollama>=0.2.0"]
postgres = ["psycopg2-binary>=2.9.0", "pgvector>=0.2.0"]
redis = ["redis>=5.0.0"]
prod = ["psycopg2-binary>=2.9.0", "pgvector>=0.2.0", "redis>=5.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "locust>=2.28.0",
]

[project.scripts]
undertow-llm = "undertow_llm.cli:main"

[project.urls]
Homepage = "https://github.com/ShriAmogh/undertow-llm"
Repository = "https://github.com/ShriAmogh/undertow-llm"

[tool.setuptools.packages.find]
where = ["."]
include = ["undertow_llm*"]

# Bundle the dashboard HTML/CSS/JS — without this the dashboard silently breaks
# when the package is installed via pip (non-Python files are ignored by default).
[tool.setuptools.package-data]
"undertow_llm" = [
    "server/templates/*.html",
    "server/static/*.css",
    "server/static/*.js",
    "server/static/*.png",
    "server/static/*.svg",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
